# This workflow was generated by AI.
name: Security scan

"on":
  schedule:
    - cron: "17 5 * * *"
  push:
    branches: [ main ]
    paths: [ flake.lock ]
  workflow_dispatch:

permissions:
  contents: read
  issues: write
  actions: write

concurrency:
  group: security-scan
  cancel-in-progress: false

jobs:
  scan:
    name: Scan hosts
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@v14

      - name: Restore NVD cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/nyx-scan
          key: nyx-scan-${{ github.run_id }}
          restore-keys: nyx-scan-

      - name: Scan hosts
        run: bash _nyx/scan_hosts --out scan

      - name: Upload report
        uses: actions/upload-artifact@v4
        with:
          name: scan-report
          path: scan/

      - name: Update tracking issue
        id: issue
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash _nyx/scan_issue scan/report.json scan/summary.md

      - name: Request a lock bump
        if: steps.issue.outputs.new_blocking != '0' || steps.issue.outputs.stale == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run update-lock.yml --ref main

      - name: Report failed scan
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          number="$(gh issue list --label nyx-security --state open --json number --jq '.[0].number // empty')"
          body="The security scan **failed**, findings are unknown until it passes again: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          if [[ -n "$number" ]]; then
            gh issue comment "$number" --body "$body"
          else
            gh label create nyx-security --color B60205 --force
            gh issue create --title "Security: open findings" --label nyx-security --body "$body"
          fi
