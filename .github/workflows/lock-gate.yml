# This workflow was generated by AI.
name: Lock gate

# Checks a lock change before it can reach main (and so `auto-upgrade` hosts):
# every host must actually build, not just evaluate, and the change must not
# introduce open critical/high CVEs. `update-lock` dispatches it on the bot
# branch, and `_nyx/adopt_lock` refuses to adopt a bump that didn't pass it.

"on":
  pull_request:
    paths:
      - flake.lock
      - templates/*/flake.lock
  workflow_dispatch:

permissions:
  contents: read

jobs:
  hosts:
    name: List hosts
    runs-on: ubuntu-latest
    outputs:
      hosts: ${{ steps.list.outputs.hosts }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@v14

      - name: List hosts
        id: list
        run: echo "hosts=$(nix eval --json .#nixosConfigurations --apply builtins.attrNames)" >> "$GITHUB_OUTPUT"

  build-hosts:
    name: Build ${{ matrix.host }}
    needs: hosts
    runs-on: ubuntu-latest
    timeout-minutes: 300
    strategy:
      fail-fast: false
      matrix:
        host: ${{ fromJSON(needs.hosts.outputs.hosts) }}

    steps:
      # Desktop closures are larger than the runner's free disk.
      - name: Free disk space
        uses: jlumbroso/free-disk-space@v1.3.1
        with:
          tool-cache: true

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@v14

      - name: Build
        run: nix build --no-link -L ".#nixosConfigurations.${{ matrix.host }}.config.system.build.toplevel"

  scan-gate:
    name: CVE gate
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@v14

      - name: Restore NVD cache
        uses: actions/cache/restore@v4
        with:
          path: ~/.cache/nyx-scan
          key: nyx-scan-${{ github.run_id }}
          restore-keys: nyx-scan-

      - name: Scan base and head
        env:
          BASE: ${{ github.event.pull_request.base.sha || 'origin/main' }}
        run: |
          bash _nyx/scan_hosts --flake "git+file://$PWD?rev=$(git rev-parse "$BASE")" --out scan-base
          bash _nyx/scan_hosts --out scan-head

      - name: Gate
        run: |
          rc=0
          bash _nyx/scan_diff --gate scan-base/report.json scan-head/report.json > delta.md || rc=$?
          cat delta.md >> "$GITHUB_STEP_SUMMARY"
          [[ "$rc" == 0 ]] || { echo "::error::lock change introduces open critical/high findings, see the job summary"; exit "$rc"; }
