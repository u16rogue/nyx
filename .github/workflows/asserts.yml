# This workflow was generated by AI.
name: Asserts

"on":
  push:
  pull_request:

jobs:
  asserts:
    name: Run asserts
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@v14

      - name: Flake check
        continue-on-error: true
        id: flake-check
        run: nix flake check --all-systems

      - name: Assert state
        continue-on-error: true
        id: assert-state
        run: bash _nyx/assert_state

      - name: Assert templates
        continue-on-error: true
        id: assert-templates
        run: bash _nyx/assert_templates

      - name: Assert host keys
        continue-on-error: true
        id: assert-host-keys
        run: bash _nyx/assert_host_keys

      - name: Aggregate results
        if: always()
        run: |
          no_fail=1
          [[ "${{ steps.flake-check.outcome }}" != "success" ]] && {
            no_fail=0;
            echo "::error::flake check failed" >&2;
          }
          [[ "${{ steps.assert-state.outcome }}" != "success" ]] && {
            no_fail=0;
            echo "::error::state check failed" >&2;
          }
          [[ "${{ steps.assert-templates.outcome }}" != "success" ]] && {
            no_fail=0;
            echo "::error::templates check failed" >&2;
          }
          [[ "${{ steps.assert-host-keys.outcome }}" != "success" ]] && {
            no_fail=0;
            echo "::error::host key entries check failed" >&2;
          }
          if [[ "$no_fail" != "1" ]]; then
            echo "::error::one or more asserts failed" >&2
            exit 1
          fi
