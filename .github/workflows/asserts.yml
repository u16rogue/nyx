# This workflow was generated by AI.
# It runs the repository's Nix assertions through the flake check entrypoint.
name: Asserts

"on":
  push:
  pull_request:

jobs:
  asserts:
    name: Run asserts
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@v14

      - name: Flake check
        continue-on-error: true
        id: flake-check
        run: nix flake check --all-systems

      - name: Assert state
        continue-on-error: true
        id: assert-state
        run: bash _nyx/assert_state

      - name: Assert templates
        continue-on-error: true
        id: assert-templates
        run: bash _nyx/assert_templates

      - name: Assert host keys
        continue-on-error: true
        id: assert-host-keys
        run: bash _nyx/assert_host_keys

      - name: Aggregate results
        if: always()
        run: |
          if [[ "${{ steps.flake-check.outcome }}" != "success" ]] || \
             [[ "${{ steps.assert-state.outcome }}" != "success" ]] || \
             [[ "${{ steps.assert-templates.outcome }}" != "success" ]] || \
             [[ "${{ steps.assert-host-keys.outcome }}" != "success" ]]; then
              echo "::error::one or more asserts failed" >&2
              exit 1
          fi
