# This workflow was generated by AI.
name: Update lock

# Proposes one `bot/flake-lock` PR bumping every flake input, with the CVE
# delta in its description. The PR is never merged: adopt it with
# `_nyx/adopt_lock`, which re-commits the gated locks as your own signed commit.
#
# Uses the job's GITHUB_TOKEN (no app, no long-lived key). PRs opened with it
# don't trigger workflows, so the checks are dispatched on the bot branch and
# attach to its commit. Needs "Allow GitHub Actions to create and approve pull
# requests" in Settings → Actions → General.
#
# This job can write to the repository, so its actions are pinned to commits.

"on":
  schedule:
    - cron: "23 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: update-lock
  cancel-in-progress: false

jobs:
  update-lock:
    name: Bump flake.lock
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: write
      pull-requests: write
      actions: write
    env:
      BRANCH: bot/flake-lock

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: main

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@da36cb69b1c3247ad7a1f931ebfd954a1105ef14 # v14

      - name: Restore NVD cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.cache/nyx-scan
          key: nyx-scan-${{ github.run_id }}
          restore-keys: nyx-scan-

      - name: Scan current lock
        run: bash _nyx/scan_hosts --out scan-old

      - name: Update locks
        id: update
        run: |
          rc=0
          bash _nyx/update_lock || rc=$?
          case "$rc" in
            0) echo "changed=true" >> "$GITHUB_OUTPUT" ;;
            10) echo "changed=false" >> "$GITHUB_OUTPUT" ;;
            *) exit "$rc" ;;
          esac

      # main already has these locks (adopted, or bumped by hand): the PR is obsolete.
      - name: Close obsolete PR
        if: steps.update.outputs.changed == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          number="$(gh pr list --head "$BRANCH" --base main --state open --json number --jq '.[0].number // empty')"
          if [[ -n "$number" ]]; then
            gh pr close "$number" --delete-branch --comment "main is up to date with every input, closing."
          fi

      - name: Scan updated lock
        if: steps.update.outputs.changed == 'true'
        run: bash _nyx/scan_hosts --out scan-new

      - name: Describe bump
        if: steps.update.outputs.changed == 'true'
        run: |
          {
            echo "Automated bump of every flake input, with template locks synced."
            echo
            echo "**Don't merge this PR.** Once the checks pass, adopt it as your own signed commit with \`bash _nyx/adopt_lock\`. Pushing that to main deploys it: \`release_hosts\` publishes the changed hosts and \`auto-upgrade\` hosts switch to it."
            echo
            bash _nyx/scan_diff scan-old/report.json scan-new/report.json
          } > pr-body.md
          cat pr-body.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload reports
        if: steps.update.outputs.changed == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: scan-reports
          path: |
            scan-old/
            scan-new/

      - name: Push branch and open or update PR
        if: steps.update.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -C "$BRANCH"
          git add flake.lock templates/*/flake.lock
          git commit -m "flake.lock: bump all inputs" -m "$(nix flake metadata --json | jq -r '.locks.nodes[.locks.nodes[.locks.root].inputs.nixpkgs].locked | "nixpkgs: \(.rev)"')"
          git push --force origin "$BRANCH"
          number="$(gh pr list --head "$BRANCH" --base main --state open --json number --jq '.[0].number // empty')"
          if [[ -n "$number" ]]; then
            gh pr edit "$number" --body-file pr-body.md
          else
            gh pr create --head "$BRANCH" --base main --title "flake.lock: bump all inputs" --body-file pr-body.md
          fi

      - name: Run checks on the branch
        if: steps.update.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow run asserts.yml --ref "$BRANCH"
          gh workflow run lock-gate.yml --ref "$BRANCH"
