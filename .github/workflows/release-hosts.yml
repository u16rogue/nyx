# This workflow was generated by AI.
name: Release hosts

"on":
  workflow_run:
    workflows: [ Asserts ]
    types: [ completed ]
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-hosts
  cancel-in-progress: false

jobs:
  release-hosts:
    name: Release changed hosts
    runs-on: ubuntu-latest
    # Only release commits pushed to main that passed every assert
    if: (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push')

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@v14

      - name: Release hosts
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash _nyx/release_hosts "${{ github.event.workflow_run.head_sha || github.sha }}"
